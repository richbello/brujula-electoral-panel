name: Actualizar seguridad y convivencia

# Genera data/seguridad/soacha.json y data/seguridad/cundinamarca.json con la
# estadistica delictiva de la Policia Nacional (SIEDCO): descarga los archivos
# de "Informacion de delitos a nivel de registro" de cada anio, filtra
# Cundinamarca y publica solo cifras agregadas.
#
# Se ejecuta a mano desde la pestana Actions y el dia 12 de cada mes, porque
# la Policia actualiza los archivos mensualmente.

on:
  workflow_dispatch:
    inputs:
      municipio:
        description: "Municipio principal"
        required: true
        default: "Soacha"
      desde:
        description: "Desde que anio"
        required: true
        default: "2020"
  schedule:
    # dia 12 de cada mes, 11:20 UTC = 6:20 a.m. en Bogota
    - cron: "20 11 12 * *"

permissions:
  contents: write

concurrency:
  group: seguridad
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install --quiet requests openpyxl
      - name: Generar el corte
        env:
          MUNICIPIO: ${{ github.event.inputs.municipio || 'Soacha' }}
          DESDE: ${{ github.event.inputs.desde || '2020' }}
        run: python etl_seguridad.py --municipio "$MUNICIPIO" --desde "$DESDE"
      - name: Resumen del corte
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("data/seguridad/soacha.json").read_text("utf-8"))
          print(f"## Seguridad y convivencia — {d['municipio']} (corte {d['corte']})\n")
          print("| Delito | " + " | ".join(str(a) for a in d["anios"]) + " |")
          print("|---|" + "---:|" * len(d["anios"]))
          for k, v in d["delitos"].items():
              print(f"| {k} | " + " | ".join(f"{v['anual'].get(str(a), 0):,}" for a in d["anios"]) + " |")
          print("\n### Columnas detectadas por hoja\n")
          for k, v in d["columnas_detectadas"].items():
              print(f"- **{k}**: {', '.join(v)}")
          PY
      - name: Publicar el corte
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seguridad/
          if git diff --staged --quiet; then
            echo "Sin cambios."; exit 0
          fi
          git commit -m "Corte de seguridad y convivencia $(date -u +%Y-%m-%d)

          Generado por el workflow Actualizar seguridad y convivencia. Fuente: Policia Nacional (SIEDCO)."
          git pull --rebase
          git push
