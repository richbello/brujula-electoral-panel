<!DOCTYPE html><html><head><meta charset=UTF-8><title>Electoral 2027</title><script src=https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI';background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{max-width:1200px;margin:0 auto;background:white;border-radius:12px}.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:40px;text-align:center}.tabs{display:flex;background:#f5f5f5;border-bottom:2px solid #ddd}.tab-button{flex:1;padding:16px;border:none;background:#f5f5f5;cursor:pointer;font-size:14px;font-weight:600;color:#666;border-bottom:4px solid transparent}.tab-button.active{background:white;color:#667eea;border-bottom-color:#667eea}.tab-content{display:none;padding:40px}.tab-content.active{display:block}.chart-container{position:relative;height:400px;margin:30px 0}table{width:100%;border-collapse:collapse;margin:20px 0}th{background:#667eea;color:white;padding:12px}.delta-positive{color:#27ae60;font-weight:bold}</style></head><body><div class=container><div class=header><h1>Brujula Electoral 2027</h1></div><div class=tabs><button class='tab-button active' onclick='switchTab(0)'>Desagregacion</button><button class=tab-button onclick='switchTab(1)'>Volatilidad</button><button class=tab-button onclick='switchTab(2)'>Prediccion</button></div><div id=tab-0 class='tab-content active'><h2>Impacto Petro</h2><canvas id=chart1></canvas><table id=table1><thead><tr><th>Localidad</th><th>2023</th><th>2026</th><th>Delta</th></tr></thead><tbody></tbody></table></div><div id=tab-1 class=tab-content><h2>Volatilidad</h2><canvas id=chart2></canvas><table id=table2><thead><tr><th>Ideologia</th><th>2023</th><th>2026</th><th>Factor</th></tr></thead><tbody></tbody></table></div><div id=tab-2 class=tab-content><h2>Candidatos 2027</h2><table id=table3><thead><tr><th>Candidato</th><th>Partido</th><th>2023</th><th>2027</th></tr></thead><tbody></tbody></table></div></div><script>const d=[{l:'USAQUEN',p23:1,p26:48.2,d:47.2},{l:'TUNJUELITO',p23:.8,p26:46.7,d:45.9},{l:'USME',p23:.8,p26:45.6,d:44.8},{l:'SAN CRISTOBAL',p23:.7,p26:42.1,d:41.4},{l:'BOSA',p23:1,p26:37,d:36},{l:'CIUDAD BOLIVAR',p23:.9,p26:36.3,d:35.4},{l:'TEUSAQUILLO',p23:2,p26:35.1,d:33.1},{l:'ENGATIVA',p23:1.1,p26:30.9,d:29.8},{l:'PUENTE ARANDA',p23:1.9,p26:19.3,d:17.4}];const v=[{i:'IZQUIERDA',v23:103036,v26:660785,f:6.413},{i:'DERECHA',v23:847900,v26:474831,f:.56},{i:'CENTRO',v23:3341573,v26:554987,f:.166},{i:'OTRO',v23:4444396,v26:804487,f:.173}];const p=[{c:'FELIPE JIMENEZ',p:'DIGNIDAD',v23:551,v27:3534},{c:'FREDDY VILLAQUIRAN',p:'DIGNIDAD',v23:293,v27:1879},{c:'JORGE ROBLEDO',p:'DIGNIDAD',v23:286,v27:1834}];function switchTab(t){document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-button').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.querySelectorAll('.tab-button')[t].classList.add('active')}window.onload=()=>{document.querySelector('#table1 tbody').innerHTML=d.map(x=>'<tr><td>'+x.l+'</td><td>'+x.p23+'</td><td>'+x.p26+'</td><td class=delta-positive>'+x.d+'</td></tr>').join('');new Chart(document.getElementById('chart1'),{type:'bar',data:{labels:d.map(x=>x.l),datasets:[{label:'Delta',data:d.map(x=>x.d),backgroundColor:'#e74c3c'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false}});document.querySelector('#table2 tbody').innerHTML=v.map(x=>'<tr><td>'+x.i+'</td><td>'+x.v23+'</td><td>'+x.v26+'</td><td>'+x.f+'x</td></tr>').join('');new Chart(document.getElementById('chart2'),{type:'bar',data:{labels:v.map(x=>x.i),datasets:[{label:'2023',data:v.map(x=>x.v23),backgroundColor:'#667eea'},{label:'2026',data:v.map(x=>x.v26),backgroundColor:'#764ba2'}]},options:{responsive:true,maintainAspectRatio:false}});document.querySelector('#table3 tbody').innerHTML=p.map(x=>'<tr><td>'+x.c+'</td><td>'+x.p+'</td><td>'+x.v23+'</td><td>'+x.v27+'</td></tr>').join('')}</script></body></html>
